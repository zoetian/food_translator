services:
  - type: web
    name: foodify-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-1
      - key: DAILY_REQUEST_CAP
        value: "10"
      - key: CORS_ORIGINS
        value: '["https://zoetian.github.io"]'
